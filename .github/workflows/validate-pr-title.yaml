name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      # For merge queue: PR title was already validated, just succeed.
      # A step-level `if:` is safe here, unlike in dco.yaml, because this step
      # runs on merge_group and so the job never skips entirely.
      - name: Skip validation for merge queue
        if: github.event_name == 'merge_group'
        run: echo "PR title was already validated before entering merge queue"

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            api
            nodepool
            project
            department
            ci
            release
            docs
            deps
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
