name: Validate Changelog

on:
  pull_request:
    # labeled/unlabeled: without them, applying skip-changelog does not re-run this check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.ref || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-changelog:
    # This name is the required status check in the branch ruleset. Keep it stable.
    name: Validate Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Skip validation for merge queue
        if: github.event_name == 'merge_group'
        run: echo "Changelog was already validated before entering merge queue"

      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Needed to resolve the merge base against the target branch.
          fetch-depth: 0

      - name: Check changelog entry added
        if: github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
          && !contains(github.event.pull_request.labels.*.name, 'dependencies')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "Changelog entry added."
          else
            echo "::error::No CHANGELOG.md entry. Add one under '## [Unreleased]', or apply the 'skip-changelog' label if this change is not user-visible."
            exit 1
          fi
