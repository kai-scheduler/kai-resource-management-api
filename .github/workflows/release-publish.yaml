# Release, step 2 of 2 — Tag & Publish (automatic).
#
# Fires when a "release/prepare-*" PR from release-prepare.yaml is merged into main. Reads the
# top version section of CHANGELOG.md, tags the merge commit, and creates the GitHub Release
# with that section as the notes. The Go module proxy serves the module from the tag.

name: Release — Tag & Publish

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Tag & create GitHub Release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/prepare-')
    runs-on: ubuntu-latest
    steps:
      # The merge commit, not the tip of main: another PR may have merged since.
      - name: Checkout the merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.KAIBOT_TOKEN }}

      - name: Derive version and release notes from CHANGELOG.md
        id: notes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # The first heading is the empty Unreleased; the second is the version this PR added.
          VERSION="$(grep -oE '^## \[[^]]+\]' CHANGELOG.md | sed -n 2p | sed -E 's/^## \[(.+)\]/\1/')"
          BRANCH_VERSION="${HEAD_REF#release/prepare-}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read a version heading from CHANGELOG.md"; exit 1
          fi
          if [ "$VERSION" != "$BRANCH_VERSION" ]; then
            echo "::error::CHANGELOG top version ($VERSION) != branch version ($BRANCH_VERSION)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi

          # The body of that section, up to the next "## [" heading, without leading blank lines.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { inside = 1; next }
            /^## \[/ { inside = 0 }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d' > "${RUNNER_TEMP:-/tmp}/notes.md"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION notes:"; cat "${RUNNER_TEMP:-/tmp}/notes.md"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.KAIBOT_TOKEN }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file "${RUNNER_TEMP:-/tmp}/notes.md"
